# OpenCode OMO — omoweb.evolucsia.com
# Portas internas: 4096 (web), 8080 (serve) — sem exposição externa, só via Caddy
services:
  opencode-omo:
    image: opencode-omo:latest
    container_name: opencode-omo
    restart: unless-stopped
    ports:
      - "7000-7020:7000-7020"
    volumes:
      - opencode-omo-root:/root
      - opencode-omo-workspace:/workspace
    environment:
      - HOST=0.0.0.0
      - PORT=4096
      - OMO_MODE=omo-full
      - OPENCODE_SERVER_HOSTNAME=0.0.0.0
      - MISE_YES=1
      - OPENAI_API_BASE=http://9router:20128/v1
      - OPENAI_API_KEY=sk-9router-E8EDDFB8B2B3377CC5C21390809BF40E
      - ANTHROPIC_BASE_URL=http://9router:20128/v1
      - ANTHROPIC_API_KEY=sk-9router-E8EDDFB8B2B3377CC5C21390809BF40E
      - GOOGLE_GENERATIVE_AI_BASE_URL=http://9router:20128/v1
      - GOOGLE_API_KEY=sk-9router-E8EDDFB8B2B3377CC5C21390809BF40E
      - GEMINI_API_KEY=sk-9router-E8EDDFB8B2B3377CC5C21390809BF40E
      - GOOGLE_GENERATIVE_AI_API_KEY=sk-9router-E8EDDFB8B2B3377CC5C21390809BF40E
      - DEEPSEEK_API_KEY=sk-9router-E8EDDFB8B2B3377CC5C21390809BF40E
      - OPENROUTER_API_KEY=sk-9router-E8EDDFB8B2B3377CC5C21390809BF40E
      - GROQ_API_KEY=sk-9router-E8EDDFB8B2B3377CC5C21390809BF40E
      - MISTRAL_API_KEY=sk-9router-E8EDDFB8B2B3377CC5C21390809BF40E
      - XAI_API_KEY=sk-9router-E8EDDFB8B2B3377CC5C21390809BF40E
    networks:
      - web
    labels:
      - "app=opencode-omo"
      - "domain=omoweb.evolucsia.com"

volumes:
  opencode-omo-root:
    name: opencode-omo-root
    external: true
  opencode-omo-workspace:
    name: opencode-omo-workspace
    external: true

networks:
  web:
    name: web
    external: true
